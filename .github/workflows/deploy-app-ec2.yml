# Full app deployment to EC2: build frontend + backend, copy to EC2, restart service (pm2)
# Requires: EC2_SSH_KEY, EC2_HOST; optional: EC2_APP_URL (for frontend API URL), EC2_APP_PATH (default /home/ubuntu/app)
name: Deploy App to EC2

on:
  push:
    branches: [main, master]
    paths:
      - 'client/**'
      - 'server/**'
      - '.github/workflows/deploy-app-ec2.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build client
        working-directory: ./client
        env:
          # Public URL of your app on EC2 (e.g. http://ec2-xx.compute.amazonaws.com:3000) so frontend calls correct API
          VITE_API_URL: ${{ secrets.EC2_APP_URL }}
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Copy app to EC2
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH || '/home/ubuntu/app' }}
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} "mkdir -p $APP_PATH/server $APP_PATH/client"
          scp -i ~/.ssh/ec2_key.pem -r server/* ubuntu@${{ secrets.EC2_HOST }}:$APP_PATH/server/
          scp -i ~/.ssh/ec2_key.pem -r client/dist ubuntu@${{ secrets.EC2_HOST }}:$APP_PATH/client/

      - name: Install deps and restart service on EC2
        env:
          APP_PATH: ${{ secrets.EC2_APP_PATH || '/home/ubuntu/app' }}
        run: |
          ssh -i ~/.ssh/ec2_key.pem ubuntu@${{ secrets.EC2_HOST }} "
            set -e
            cd $APP_PATH/server
            npm ci --omit=dev
            export NODE_ENV=production
            pm2 restart shophub 2>/dev/null || pm2 start server.js --name shophub
            pm2 save
          "
      - name: Done
        run: echo "Deployed to EC2. App should be running (pm2 restart shophub)."
