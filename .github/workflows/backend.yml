name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'server/**'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'server/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: server/package-lock.json

    - name: Install dependencies
      working-directory: ./server
      run: npm ci

    - name: Run tests
      working-directory: ./server
      run: npm test
