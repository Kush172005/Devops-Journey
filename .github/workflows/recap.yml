on:
    workflow_dispatch:
        inputs:
            name:
                description: "Kush"
                required: true
                type: string
            age:
                description: "21"
                required: true
                type: number
            city:
                description: "India"
                required: true
                type: string
jobs:
    hello-world:
        runs-on: ubuntu-latest
        steps:
            - name: Hello World
              run: |
                echo "Hello World"
                echo "Name: ${{ github.event.inputs.name }}"
                echo "Age: ${{ github.event.inputs.age }}"
                echo "City: ${{ github.event.inputs.city }}" 
            - name: List Files
              run: ls -la 
            - name: Checkout code
              uses: actions/checkout@v4
            - name: List Files
              run: ls -la
    weather:
        runs-on: ubuntu-latest
        steps:
            - name: Get Weather
              run: curl -s wttr.in