# Rubric order: Tests → Terraform (init/validate/plan/apply) → Docker build/push → ECS deploy + verify
# AWS Academy: session token + LabRole in Terraform + subnet/SG secrets.
# Remote state: create S3 + DynamoDB once (see repo instructions), then TF_STATE_* secrets.

name: CI/CD — Tests, Terraform, ECS

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "terraform/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "terraform/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  APP_NAME: devops-lab-app
  TF_VERSION: 1.9.8
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
  TF_STATE_KEY: terraform/devops-lab-app.tfstate
  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
  TF_VAR_app_name: devops-lab-app
  TF_VAR_subnet_id: ${{ secrets.AWS_SUBNET_ID }}
  TF_VAR_subnet_id_2: ${{ secrets.AWS_SUBNET_ID_2 }}
  TF_VAR_security_group_id: ${{ secrets.AWS_SECURITY_GROUP_ID }}

jobs:
  test:
    name: Phase 1 — Tests & reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Backend — install & test (coverage + integration)
        working-directory: server
        run: |
          npm ci
          mkdir -p test-reports
          npm run test:ci

      - name: Frontend — install & test (JUnit)
        working-directory: client
        run: |
          npm ci
          mkdir -p test-reports
          npm run test:ci

      - name: Merge test reports for artifact
        run: |
          mkdir -p upload-reports
          cp -R server/test-reports/. upload-reports/ 2>/dev/null || true
          cp -R client/test-reports/. upload-reports/ 2>/dev/null || true
          ls -la upload-reports || true

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: upload-reports
          if-no-files-found: warn

  terraform:
    name: Phase 2 — Terraform (S3, ECR, ECS)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      alb_dns: ${{ steps.tf_outputs.outputs.alb_dns }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.AWS_ACCESS_KEY_ID }}" || (echo "Missing AWS_ACCESS_KEY_ID" && exit 1)
          test -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" || (echo "Missing AWS_SECRET_ACCESS_KEY" && exit 1)
          test -n "${{ secrets.AWS_SESSION_TOKEN }}" || (echo "Missing AWS_SESSION_TOKEN" && exit 1)
          test -n "${{ env.AWS_REGION }}" || (echo "Missing AWS_REGION" && exit 1)
          test -n "${{ env.TF_VAR_subnet_id }}" || (echo "Missing AWS_SUBNET_ID" && exit 1)
          test -n "${{ env.TF_VAR_security_group_id }}" || (echo "Missing AWS_SECURITY_GROUP_ID" && exit 1)
          test -n "${{ env.TF_STATE_BUCKET }}" || (echo "Missing TF_STATE_BUCKET (create S3 bucket first — see instructions)" && exit 1)
          test -n "${{ env.TF_STATE_LOCK_TABLE }}" || (echo "Missing TF_STATE_LOCK_TABLE (create DynamoDB table first)" && exit 1)

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Import existing AWS resources (only if missing from Terraform state)
        working-directory: terraform
        run: |
          set +e
          aws ecr describe-repositories --repository-names "${APP_NAME}" --region "${AWS_REGION}" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "${APP_NAME}" --region "${AWS_REGION}"

          import_if_absent() {
            ADDR="$1"
            ID="$2"
            if terraform state show -no-color "$ADDR" >/dev/null 2>&1; then
              echo "State already tracks $ADDR — skip import"
            else
              echo "Importing $ADDR ..."
              terraform import -input=false "$ADDR" "$ID"
              RC=$?
              if [ "$RC" -ne 0 ]; then
                echo "Import returned $RC (will rely on plan/apply if resource is new)"
              fi
            fi
          }

          import_if_absent "aws_ecr_repository.app" "${APP_NAME}"
          import_if_absent "aws_ecs_cluster.app" "${APP_NAME}-cluster"
          import_if_absent "aws_ecs_service.app" "${APP_NAME}-cluster/${APP_NAME}-service"
          exit 0

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Export ALB DNS
        id: tf_outputs
        working-directory: terraform
        run: |
          set -euo pipefail
          DNS="$(terraform output -json alb_dns_name | jq -r '(if type == "string" then . else .value end) // empty')"
          DNS="$(printf '%s' "$DNS" | tr -d '\r\n')"
          if [ -z "$DNS" ] || [ "$DNS" = "null" ]; then
            echo "FATAL: alb_dns_name is empty after apply"
            terraform output -json || true
            exit 1
          fi
          {
            echo "alb_dns<<__ALB_EOF__"
            printf '%s\n' "$DNS"
            echo "__ALB_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Exported ALB DNS for job output (length ${#DNS})"

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: upload-reports

      - name: Upload test reports to S3 (provisioned bucket)
        working-directory: terraform
        run: |
          BUCKET=$(terraform output -raw reports_bucket_name)
          if [ -d "$GITHUB_WORKSPACE/upload-reports" ] && [ "$(ls -A "$GITHUB_WORKSPACE/upload-reports" 2>/dev/null)" ]; then
            aws s3 sync "$GITHUB_WORKSPACE/upload-reports/" "s3://${BUCKET}/ci/${{ github.run_id }}/" --region "${AWS_REGION}"
            echo "Reports synced to s3://${BUCKET}/ci/${{ github.run_id }}/"
          else
            echo "No local test files to sync (artifact empty)."
          fi

  docker_push:
    name: Phase 3 — Docker build & push to ECR
    runs-on: ubuntu-latest
    needs: [terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag & push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${{ env.APP_NAME }}:${IMAGE_TAG}"
          LATEST_URI="${ECR_REGISTRY}/${{ env.APP_NAME }}:latest"
          docker build -t "$IMAGE_URI" -t "$LATEST_URI" .
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"
          echo "Pushed $LATEST_URI"

  ecs_deploy_verify:
    name: Phase 3 — ECS rollout & verify
    runs-on: ubuntu-latest
    needs: [terraform, docker_push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Scale service & force new deployment (image now in ECR)
        env:
          CLUSTER: ${{ env.APP_NAME }}-cluster
          SERVICE: ${{ env.APP_NAME }}-service
          AWS_MAX_ATTEMPTS: "120"
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --desired-count 1 \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"
          if ! aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --region "${{ env.AWS_REGION }}"; then
            echo "=== ECS service events (last 20) ==="
            aws ecs describe-services \
              --cluster "$CLUSTER" \
              --services "$SERVICE" \
              --region "${{ env.AWS_REGION }}" \
              --query 'services[0].events[:20]' \
              --output table
            echo "=== Recent stopped tasks (explain exit) ==="
            aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" --desired-status STOPPED --region "${{ env.AWS_REGION }}" --max-items 3 --query 'taskArns' --output text | tr '\t' '\n' | while read -r t; do
              [ -z "$t" ] || [ "$t" = "None" ] && continue
              aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$t" --region "${{ env.AWS_REGION }}" \
                --query 'tasks[0].{stoppedReason:stoppedReason,stopCode:stopCode,containers:containers[*].{name:name,reason:reason,exitCode:exitCode}}' \
                --output json
            done
            exit 1
          fi

      - name: Verify /health via Application Load Balancer
        env:
          ALB_DNS_FROM_TF: ${{ needs.terraform.outputs.alb_dns }}
        run: |
          set -euo pipefail
          trim() { printf '%s' "${1:-}" | tr -d '\r\n'; }
          ALB_DNS="$(trim "${ALB_DNS_FROM_TF:-}")"
          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "null" ]; then
            echo "Terraform job output alb_dns missing (common if you re-ran only failed jobs). Resolving from ELB name prefix ${APP_NAME}-alb- ..."
            ALB_DNS="$(aws elbv2 describe-load-balancers --region "${AWS_REGION}" --output json \
              | jq -r --arg p "${APP_NAME}-alb-" '.LoadBalancers[]? | select(.LoadBalancerName | startswith($p)) | .DNSName' \
              | head -n1)"
            ALB_DNS="$(trim "$ALB_DNS")"
          fi
          if [ -z "$ALB_DNS" ] || [ "$ALB_DNS" = "None" ]; then
            echo "Could not determine ALB DNS. Check: (1) full workflow run so Terraform export runs, or (2) IAM allows elasticloadbalancing:DescribeLoadBalancers, or (3) ALB exists with name starting ${APP_NAME}-alb-"
            exit 1
          fi
          echo "Site URL: http://${ALB_DNS}/"
          for i in $(seq 1 36); do
            if curl -fsS --max-time 15 "http://${ALB_DNS}/health"; then
              echo "OK — ALB health check passed"
              exit 0
            fi
            echo "Waiting for targets healthy behind ALB... ($i/36)"
            sleep 10
          done
          echo "Timed out waiting for ALB /health"
          exit 1
