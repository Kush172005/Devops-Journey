# Rubric order: Tests → Terraform (init/validate/plan/apply) → Docker build/push → ECS deploy + verify
# AWS Academy: session token + LabRole in Terraform + subnet/SG secrets.
# Remote state: create S3 + DynamoDB once (see repo instructions), then TF_STATE_* secrets.

name: CI/CD — Tests, Terraform, ECS

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "terraform/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "terraform/**"
      - "Dockerfile"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  APP_NAME: devops-lab-app
  TF_VERSION: 1.9.8
  TF_IN_AUTOMATION: "true"
  TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
  TF_STATE_LOCK_TABLE: ${{ secrets.TF_STATE_LOCK_TABLE }}
  TF_STATE_KEY: terraform/devops-lab-app.tfstate
  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
  TF_VAR_app_name: devops-lab-app
  TF_VAR_subnet_id: ${{ secrets.AWS_SUBNET_ID }}
  TF_VAR_security_group_id: ${{ secrets.AWS_SECURITY_GROUP_ID }}

jobs:
  test:
    name: Phase 1 — Tests & reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Backend — install & test (coverage + integration)
        working-directory: server
        run: |
          npm ci
          mkdir -p test-reports
          npm run test:ci

      - name: Frontend — install & test (JUnit)
        working-directory: client
        run: |
          npm ci
          mkdir -p test-reports
          npm run test:ci

      - name: Merge test reports for artifact
        run: |
          mkdir -p upload-reports
          cp -R server/test-reports/. upload-reports/ 2>/dev/null || true
          cp -R client/test-reports/. upload-reports/ 2>/dev/null || true
          ls -la upload-reports || true

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: upload-reports
          if-no-files-found: warn

  terraform:
    name: Phase 2 — Terraform (S3, ECR, ECS)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.AWS_ACCESS_KEY_ID }}" || (echo "Missing AWS_ACCESS_KEY_ID" && exit 1)
          test -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" || (echo "Missing AWS_SECRET_ACCESS_KEY" && exit 1)
          test -n "${{ secrets.AWS_SESSION_TOKEN }}" || (echo "Missing AWS_SESSION_TOKEN" && exit 1)
          test -n "${{ env.AWS_REGION }}" || (echo "Missing AWS_REGION" && exit 1)
          test -n "${{ env.TF_VAR_subnet_id }}" || (echo "Missing AWS_SUBNET_ID" && exit 1)
          test -n "${{ env.TF_VAR_security_group_id }}" || (echo "Missing AWS_SECURITY_GROUP_ID" && exit 1)
          test -n "${{ env.TF_STATE_BUCKET }}" || (echo "Missing TF_STATE_BUCKET (create S3 bucket first — see instructions)" && exit 1)
          test -n "${{ env.TF_STATE_LOCK_TABLE }}" || (echo "Missing TF_STATE_LOCK_TABLE (create DynamoDB table first)" && exit 1)

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform fmt check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform init
        working-directory: terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}"

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Download test reports
        uses: actions/download-artifact@v4
        with:
          name: test-reports
          path: upload-reports

      - name: Upload test reports to S3 (provisioned bucket)
        working-directory: terraform
        run: |
          BUCKET=$(terraform output -raw reports_bucket_name)
          if [ -d "$GITHUB_WORKSPACE/upload-reports" ] && [ "$(ls -A "$GITHUB_WORKSPACE/upload-reports" 2>/dev/null)" ]; then
            aws s3 sync "$GITHUB_WORKSPACE/upload-reports/" "s3://${BUCKET}/ci/${{ github.run_id }}/" --region "${AWS_REGION}"
            echo "Reports synced to s3://${BUCKET}/ci/${{ github.run_id }}/"
          else
            echo "No local test files to sync (artifact empty)."
          fi

  docker_push:
    name: Phase 3 — Docker build & push to ECR
    runs-on: ubuntu-latest
    needs: [terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag & push
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${{ env.APP_NAME }}:${IMAGE_TAG}"
          LATEST_URI="${ECR_REGISTRY}/${{ env.APP_NAME }}:latest"
          docker build -t "$IMAGE_URI" -t "$LATEST_URI" .
          docker push "$IMAGE_URI"
          docker push "$LATEST_URI"
          echo "Pushed $LATEST_URI"

  ecs_deploy_verify:
    name: Phase 3 — ECS rollout & verify
    runs-on: ubuntu-latest
    needs: [docker_push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Scale service & force new deployment (image now in ECR)
        env:
          CLUSTER: ${{ env.APP_NAME }}-cluster
          SERVICE: ${{ env.APP_NAME }}-service
        run: |
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "$SERVICE" \
            --desired-count 1 \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"
          aws ecs wait services-stable \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --region "${{ env.AWS_REGION }}"

      - name: Verify /health on task public IP
        env:
          CLUSTER: ${{ env.APP_NAME }}-cluster
          SERVICE: ${{ env.APP_NAME }}-service
        run: |
          TASK_ARN=$(aws ecs list-tasks --cluster "$CLUSTER" --service-name "$SERVICE" --desired-status RUNNING --region "${{ env.AWS_REGION }}" --query 'taskArns[0]' --output text)
          test -n "$TASK_ARN" && test "$TASK_ARN" != "None" || (echo "No running task" && exit 1)
          ENI=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --region "${{ env.AWS_REGION }}" --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' --output text)
          test -n "$ENI" || (echo "No ENI" && exit 1)
          PUBLIC_IP=$(aws ec2 describe-network-interfaces --network-interface-ids "$ENI" --region "${{ env.AWS_REGION }}" --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
          test -n "$PUBLIC_IP" && test "$PUBLIC_IP" != "None" || (echo "No public IP" && exit 1)
          echo "Checking http://${PUBLIC_IP}:80/health"
          curl -fsS --retry 10 --retry-delay 5 "http://${PUBLIC_IP}:80/health"
          echo "OK — service responding"
